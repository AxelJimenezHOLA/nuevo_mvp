<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Artículo Académico</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <section class="form-container">
      <header>
        <h1>Registro de Artículo</h1>
        <p>Ingrese la información básica de su artículo académico</p>
      </header>

      <form id="articleForm" novalidate>
        <div class="form-group">
          <label for="titulo">Título *</label>
          <input type="text" id="titulo" name="titulo" required>
          <small class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="autores">Autores *</label>
          <input type="text" id="autores" name="autores" required>
          <small class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="pdf">Archivo PDF *</label>
          <input type="file" id="pdf" name="pdf" accept="application/pdf" required>
          <small class="error-message"></small>
        </div>

        <button type="submit">Enviar</button>

        <div id="successMessage" class="success-message"></div>
      </form>

      <section class="articles-list">
        <h2>Artículos Guardados</h2>
        <ul id="articlesContainer"></ul>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
